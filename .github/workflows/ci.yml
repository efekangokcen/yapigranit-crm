name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-check:
    name: Build & Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yapigranit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yapigranit_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yapigranit_ci
      AUTH_SECRET: ci-test-secret-not-for-production-key-32chars
      NEXTAUTH_SECRET: ci-test-secret-not-for-production-key-32chars
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Push schema to CI database
        run: npx prisma db push --skip-generate

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npx next build
